name: 每天傳送課表通知

on:
  schedule:
    - cron: '0 11 * * 0'  # 週日 19:00 台灣時間 -> 送週一課表
    - cron: '0 11 * * 1'  # 週一 19:00 -> 送週二課表
    - cron: '0 11 * * 2'  # 週二 19:00 -> 送週三課表
    - cron: '0 11 * * 3'  # 週三 19:00 -> 送週四課表
    - cron: '0 11 * * 4'  # 週四 19:00 -> 送週五課表
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 判斷今天送哪一天的課表並送出
        run: |
          DOW=$(date -u +%u)
          case "$DOW" in
            7) TITLE="明天課表（週一）"; BODY="第一節 08:10–09:00｜國語文（陳姿穎）\n第二節 09:10–10:00｜基礎電子實習（黃筱涓、吳育智）\n第三節 10:10–11:00｜基礎電子實習（黃筱涓、吳育智）\n第四節 11:10–12:00｜基礎電子實習（黃筱涓、吳育智）\n第五節 13:10–14:00｜程式設計實習（黃筱涓、吳育智）\n第六節 14:10–15:00｜程式設計實習（黃筱涓、吳育智）\n第七節 15:15–16:05｜程式設計實習（黃筱涓、吳育智）\n第八節 16:10–17:00｜數位電路選（張偉勤）" ;;
            1) TITLE="明天課表（週二）"; BODY="第一節 08:10–09:00｜數位電路（張偉勤）\n第二節 09:10–10:00｜數位電路（張偉勤）\n第三節 10:10–11:00｜英語文（林宗平外師）\n第四節 11:10–12:00｜英語文（林宗平外師）\n第五節 13:10–14:00｜地理（邱坤豪）\n第六節 14:10–15:00｜地理（邱坤豪）\n第七節 15:15–16:05｜健康與護理（陸淑芬）\n第八節 16:10–17:00｜基本電學選（吳育智）" ;;
            2) TITLE="明天課表（週三）"; BODY="第一節 08:10–09:00｜體育（莊佳容）\n第二節 09:10–10:00｜體育（莊佳容）\n第三節 10:10–11:00｜臺灣手語／閩南語文（范文芳、宋麗華）\n第四節 11:10–12:00｜基本電學（吳育智）\n第五節 13:10–14:00｜班會（林宗平）\n第六節 14:10–15:00｜彈性學習時間\n第七節 15:15–16:05｜團體活動時間" ;;
            3) TITLE="明天課表（週四）"; BODY="第一節 08:10–09:00｜數學（林佳良）\n第二節 09:10–10:00｜數學（林佳良）\n第三節 10:10–11:00｜基本電學（吳育智）\n第四節 11:10–12:00｜基本電學（吳育智）\n第五節 13:10–14:00｜作文（陳姿穎）\n第六節 14:10–15:00｜物理（徐慧茵）\n第七節 15:15–16:05｜物理（徐慧茵）" ;;
            4) TITLE="明天課表（週五）"; BODY="第一節 08:10–09:00｜國語文（陳姿穎）\n第二節 09:10–10:00｜國語文（陳姿穎）\n第三節 10:10–11:00｜美術（徐珮玲）\n第四節 11:10–12:00｜美術（徐珮玲）\n第五節 13:10–14:00｜數學（林佳良）\n第六節 14:10–15:00｜數學（林佳良）\n第七節 15:15–16:05｜英語聽講（林宗平）\n第八節 16:10–17:00｜英文選（林宗平）" ;;
            *) echo "假日不送"; exit 0 ;;
          esac
          curl -sS -X POST "https://ntfy.sh/shuangzi-schedule-hs0819" \
            -H "Title: $TITLE" \
            -d "$(printf '%b' "$BODY")"
