name: 每日課表自動推播
on:
schedule:
# 每天 UTC 09:00 執行 (等於台灣時間下午 17:00)
# 0-4 代表週日到週四執行 (發送隔天週一到週五的課表)
- cron: '0 9 * * 0-4'
workflow_dispatch: # 允許手動點擊測試
jobs:
send_schedule:
runs-on: ubuntu-latest
steps:
- name: 執行推播程式
uses: actions/github-script@v6
with:
script: |
const topic = 'shuangzi-schedule-hs0819';
const dayNames = {1:'週一', 2:'週二', 3:'週三', 4:'週四', 5:'週五'};
const week = {
1: ["第一節 08:10–09:00｜國語文（陳姿穎）", "第二節 09:10–10:00｜基礎電子實習（黃筱涓、吳育智）", "第三節 10:10–11:00｜基礎電子實習（黃筱涓、吳育智）", "第四節 11:10–12:00｜基礎電子實習（黃筱涓、吳育智）", "第五節 13:10–14:00｜程式 শুক設計實習（黃筱涓、吳育智）", "第六節 14:10–15:00｜程式設計實習（黃筱涓、吳育智）", "第七節 15:15–16:05｜程式設計實習（黃筱涓、吳育智）", "第八節 16:10–17:00｜數位電路選（張偉勤）"],
2: ["第一節 08:10–09:00｜數位電路（張偉勤）", "第二節 09:10–10:00｜數位電路（張偉勤）", "第三節 10:10–11:00｜英語文（林宗平(外師)）", "第四節 11:10–12:00｜英語文（林宗平(外師)）", "第五節 13:10–14:00｜地理（邱坤豪）", "第六節 14:10–15:00｜地理（邱坤豪）", "第七節 15:15–16:05｜健康與護理（陸淑芬）", "第八節 16:10–17:00｜基本電學選（吳育智）"],
3: ["第一節 08:10–09:00｜體育（莊佳容）", "第二節 09:10–10:00｜體育（莊佳容）", "第三節 10:10–11:00｜臺灣手語／閩南語文（范文芳、宋麗華）", "第四節 11:10–12:00｜基本電學（吳育智）", "第五節 13:10–14:00｜班會（林宗平）", "第六節 14:10–15:00｜彈性學習時間", "第七節 15:15–16:05｜團體活動時間"],
4: ["第一節 08:10–09:00｜數學（林佳良）", "第二節 09:10–10:00｜數學（林佳良）", "第三節 10:10–11:00｜基本電學（吳育智）", "第四節 11:10–12:00｜基本電學（吳育智）", "第五節 13:10–14:00｜作文（陳姿穎）", "第六節 14:10–15:00｜物理（徐慧茵）", "第七節 15:15–16:05｜物理（徐慧茵）"],
5: ["第一節 08:10–09:00｜國語文（陳姿穎）", "第二節 09:10–10:00｜國語文（陳姿穎）", "第三節 10:10–11:00｜美術（徐珮玲(美術教室)）", "第四節 11:10–12:00｜美術（徐珮玲(美術教室)）", "第五節 13:10–14:00｜數學（林佳良）", "第六節 14:10–15:00｜數學（林佳良）", "第七節 15:15–16:05｜英語聽講（林宗平）", "第八節 16:10–17:00｜英文選（林宗平）"]
};
const todayDow = new Date().getDay();
let targetDow = todayDow + 1;
if (targetDow === 6) targetDow = 1;
if(week[targetDow]) {
const title = "=?UTF-8?B?" + Buffer.from("📚 明天課表（" + dayNames[targetDow] + "）").toString('base64') + "?=";
const message = week[targetDow].join('\n');
await fetch("https://ntfy.sh/" + topic, {
method: 'POST',
headers: { 'Title': title },
body: message
});
console.log("成功送出課表：" + dayNames[targetDow]);
}
