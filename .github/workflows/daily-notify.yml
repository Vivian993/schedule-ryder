name: 每天傳送課表通知

on:
  schedule:
    - cron: '0 11 * * 0'  # 週日 19:00 台灣時間 → 送週一課表
    - cron: '0 11 * * 1'  # 週一 19:00 → 送週二課表
    - cron: '0 11 * * 2'  # 週二 19:00 → 送週三課表
    - cron: '0 11 * * 3'  # 週三 19:00 → 送週四課表
    - cron: '0 11 * * 4'  # 週四 19:00 → 送週五課表

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: 判斷今天送哪一天的課表
        run: |
          DOW=$(date -u +%u)  # 1=週一...7=週日 (UTC)
          case "$DOW" in
            7) TITLE="明天課表（週一）"; BODY="第一節 08:10–09:00｜國語文（陳姿穎）
第二節 09:10–10:00｜基礎電子實習（黃筱涓、吳育智）
第三節 10:10–11:00｜基礎電子實習（黃筱涓、吳育智）
第四節 11:10–12:00｜基礎電子實習（黃筱涓、吳育智）
第五節 13:10–14:00｜程式設計實習（黃筱涓、吳育智）
第六節 14:10–15:00｜程式設計實習（黃筱涓、吳育智）
第七節 15:15–16:05｜程式設計實習（黃筱涓、吳育智）
第八節 16:10–17:00｜數位電路選（張偉勤）" ;;
            1) TITLE="明天課表（週二）"; BODY="第一節 08:10–09:00｜數位電路（張偉勤）
第二節 09:10–10:00｜數位電路（張偉勤）
第三節 10:10–11:00｜英語文（林宗平外師）
第四節 11:10–12:00｜英語文（林宗平外師）
第五節 13:10–14:00｜地理（邱坤豪）
第六節 14:10–15:00｜地理（邱坤豪）
第七節 15:15–16:05｜健康與護理（陸淑芬）
第八節 16:10–17:00｜基本電學選（吳育智）" ;;
            2) TITLE="明天課表（週三）"; BODY="第一節 08:10–09:00｜體育（莊佳容）
第二節 09:10–10:00｜體育（莊佳容）
第三節 10:10–11:00｜臺灣手語／閩南語文（范文芳、宋麗華）
第四節 11:10–12:00｜基本電學（吳育智）
第五節 13:10–14:00｜班會（林宗平）
第六節 14:10–15:00｜彈性學習時間
第七節 15:15–16:05｜團體活動時間" ;;
            3) TITLE="明天課表（週四）"; BODY="第一節 08:10–09:00｜數學（林佳良）
第二節 09:10–10:00｜數學（林佳良）
第三節 10:10–11:00｜基本電學（吳育智）
第四節 11:10–12:00｜基本電學（吳育智）
第五節 13:10–14:00｜作文（陳姿穎）
第六節 14:10–15:00｜物理（徐慧茵）
第七節 15:15–16:05｜物理（徐慧茵）" ;;
            4) TITLE="明天課表（週五）"; BODY="第一節 08:10–09:00｜國語文（陳姿穎）
第二節 09:10–10:00｜國語文（陳姿穎）
第三節 10:10–11:00｜美術（徐珮玲）
第四節 11:10–12:00｜美術（徐珮玲）
第五節 13:10–14:00｜數學（林佳良）
第六節 14:10–15:00｜數學（林佳良）
第七節 15:15–16:05｜英語聽講（林宗平）
第八節 16:10–17:00｜英文選（林宗平）" ;;
            *) echo "假日不送" && exit 0 ;;
          esac
          curl -X POST "https://ntfy.sh/shuangzi-schedule-hs0819" \
            -H "Title: $TITLE" \
            -d "$BODY"
